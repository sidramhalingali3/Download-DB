spring.application.name=tidb-db-downloader

server.port=8080

# Database credentials injected via environment variables
# DO NOT hardcode real credentials in this file or commit them to Git.
DB_HOST=${DB_HOST:}
DB_PORT=${DB_PORT:4000}
DB_NAME=${DB_NAME:}
DB_USERNAME=${DB_USERNAME:}
DB_PASSWORD=${DB_PASSWORD:}


# Executable path for mysqldump (defaults to system PATH command 'mysqldump')
# app.mysqldump.path=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
